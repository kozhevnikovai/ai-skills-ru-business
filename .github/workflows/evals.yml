name: evals
# Проверка качества навыков на модели. Без ключа API: GitHub Models по встроенному GITHUB_TOKEN.
on:
  workflow_dispatch:
  pull_request:
    paths: ["skills/**", "evals/**"]
permissions:
  contents: read
  models: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GitHub Models доступен
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Скажи: ок"}],"max_tokens":5}' | tail -c 400
      - name: promptfoo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
        run: |
          npx --yes promptfoo@0 eval -c evals/promptfooconfig.yaml --max-concurrency 2 --delay 4000 --no-cache -o evals-result.json -o evals-result.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals
          path: evals-result.*
