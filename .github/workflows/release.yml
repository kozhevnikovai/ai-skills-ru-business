name: release
# Публикуете релиз в интерфейсе GitHub → workflow проверяет навыки и прикладывает ZIP каждого навыка
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate.py
      - run: bash scripts/build-zips.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
