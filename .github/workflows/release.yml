name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate.py
      - run: bash scripts/build-zips.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.md
